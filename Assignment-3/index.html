<!DOCTYPE html>
<html lang="en">

<head>
	<!-- Meta Data -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Assignment 1</title>
	<meta name="description" content="This week we are looking at the basic HTML structure">
	<meta name="robots" content="nofollow, noindex">
	<link rel="stylesheet" href="./css/style.css">
</head>
<!--adding spider-Man logo-->
<body>
	<img id="spider-man-logo" src="./imgs/spider-manLogo.png" alt="Spider-Man Logo">

	<!--Adding bottom text left side-->
<div id="bottom-text">
		<div class="tiny-tags">
			<p>Sony Pictures</p>
			<p class="bold-text">Animation</p>

			<p id="marvel-box">MARVEL</p>

			<div class="tiny-tags">
				<p>THIS FILM IS NOT YET RATED</p>
				<p>FOR FUTURE INFO GO TO</p>
				<p>FILMRATINGS.COM</p>
			</div>

			<!--adding bottom center text-->
			<div id="center-text">
				<p id="release-top">ONLY ON THE BIG SCREEN</p>
				<p id="release-bottom">CHRISTMAS</p>
			</div>

			<!--right side text-->
			<div class="tiny-tags">
				<p>#SpiderVerse</p>
				<p>IntoTheSpiderVerse.Movie</p>
			</div>

			<div class="tiny-tags">
				<p>MARVEL and all related character names:</p>
				<p>© &amp; ™ 2018 MARVEL.</p>
			</div>

			<div class="tiny-tags">
				<p class="bold-text">COLUMBIA</p>
				<p class="bold-text">PICTURES</p>
			</div>
		</div>
	</div>
</body>
</html>
