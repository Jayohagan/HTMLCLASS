<!doctype HTML>
<html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="robots" content=" noindex, nofollow">
     <title>Week3 | Media and CSS</title>
     <!--add the css-->
 </head>
<body>
    <header>
        <img src="./img/lorem-logo.png" alt="Logo">
        <nav> 
            <menu>
                <li><a href=" index.html">Link one</a></li>
                <li><a href="index.html">Link two</a></li>
            </menu>
            </nav>
    </header>
    <!--this is the main text of th page-->
    <main>
        <!-- this first seciton of content is called a hero/masterhead-->
        <section>
            <div>
                <h1>This is an introduction title</h1>
            </div>
        </section>
        <section>
            <!-- this is column one-->
            <div>
                <figure>
                    <img src="./img/toronto.jpg" alt="Description of image">
                    <figcaption>lorem ipsum dolor sit amet</figcaption>
                </figure>
            </div>
            <!-- this is colunm two-->
            <div>
                <h2>I am Title</h2>
                <p>Lorem Ipsum blah blah blah</p>
            </div>
        </section>
        <!--this is our videos-->
        <section>
            <div>
                <h2>Our Videos</h2>
                <video width="400" height="300" controls>
                    <source src="./videos/sample.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>
        <div>
            <h3>iframe video</h3>
            <iframe width="500" height="300" src="https://www.youtube.com/embed/irVNGjRFZGk?si=kmWc9sfoeV3H6Ohd" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div>
            <h3>HTML video player example</h3>
            <video controls loop autoplay poster="./img/toronto.jpg">
                <source src="./video/toronto.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </main>
    <footer>
        <h6>&copy; Week 3 lesson</h6>  
    </footer>
</body>
</html>
